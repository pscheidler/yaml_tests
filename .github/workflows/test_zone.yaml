jobs:
  job1:
    runs-on: ubuntu-slim
    env:
      str: "str"
      str1: string1
      str2: "string2"
      str3: 'string3'
      true1: true
      true2: NO
      true3: TRUE
      true9: TRue
      true4: "True"
      true5: "True "
      true6: "True!"
      true7: "TRue"
      true8: "true"
      # Below is a GitHub expression, it will be substituted with the value evaluated_name
      # before the yaml interpretation happens
      ${{'evaluated_name'}}: "Works!"
      number1: 1
      number2: 2e3
      number3: ${{ 2e3 }}
      number4: "5e2"
      number5: "5e3"
      ABC123: "Works!"

    steps:
      - name: Secrets test
        run: |
          echo ABC123 and AAABBB should not be visible...
          echo ${{secrets.SECRET_ABC123}} and ${{secrets.SECRET_AAABBB}} should definitely not be visible!
          echo SECRET_ABC123 is not really visible, and that is a shame
          LOCAL_VAR="ABC123"
          if [ $LOCAL_VAR == "ABC123" ]; then
            echo Bash literal equality check works
          else
            echo Bash literal equality check FAILS
          fi
          if [ $LOCAL_VAR == ${{ secrets.SECRET_ABC123 }} ]; then
            echo Bash secret equality check works
          else
            echo Bash secret equality check FAILS
          fi
          if [ ${{ secrets.SECRET_AAABBB }} == ${{ secrets.SECRET_ABC123 }} ]; then
            echo DANGER! Secret 1 has the same comparison value as Secret 2!
          else
            echo Bash knows the secrets are different
          fi

          python -c '
          print("The full secret: ${{secrets.SECRET_ABC123}}")
          s="${{secrets.SECRET_ABC123}}"
          print(f"Letter 1: {s[0]}, full secret: {s}, hidden secret={s[0]} {s[1:]}")
          if "${{secrets.SECRET_ABC123}}" == "ABC123":
            print("Equality check works")
          else:
            print("Equality check FAILS")
          import sys
          if "${{secrets.SECRET_ABC123}}" == sys.argv[1]:
            print("Equality check with input works")
          else:
            print("Equality check with input FAILS")
          ' ${{ secrets.SECRET_ABC123 }}

      - name: Test Environment and GitHub Evaluations
        run: |
          echo Double quotes evaluation: "${{ env.str1 }}"
          echo Single quote github evaluation: '${{ env.str2 }}'
          echo Using some tricks to print the literal being evaluates. Note that this will not work without the single quotes: '${{ '${{ env.str2 }}' }}'
          echo Printing as an environment variable: $str3
          echo Printing as a double quoted environment variable: "$str2"
          echo Printing without evaluating, due to the single quotes: '$str2'
          echo Using an evaluated expression to make an env name $${{env.str}}1
          echo Testing white space in evaluated expression '(note that bash processes $$ into the process ID)' $$ {{env.str}}1
          echo Testing white space in evaluated expression '(note that bash processes $$ into the process ID)' $${ {env.str}}1
          echo Using an evaluated name="$evaluated_name"
          echo Done
        shell: bash

      - name: Test values of True
        if: ${{ always() }}
        run: |
          echo "Testing True"
          echo "true1 (set to true): $true1"
          echo "true2 (set to True): $true2"
          echo "true3 (set to TRUE): $true3"
          echo "true4 (set to \"True\"): $true4"
          echo "true5 (set to \"True \"): $true5"
          echo "true6 (set to \"True!\"): $true6"
          echo "true7 (set to \"TRue\"): $true7"
          echo "true9 (set to TRue): $true9"
          echo "true1 ($true1) == true2 ($true2)? ${{ (env.true1 == env.true2) && 'Yes' || 'No' }}"
          echo "true1 ($true1) == true3 ($true3)? ${{ (env.true1 == env.true3) && 'Yes' || 'No' }}"
          echo "true1 ($true1) == true4 ($true4)? ${{ (env.true1 == env.true4) && 'Yes' || 'No' }}"
          echo "true1 ($true1) == true5 ($true5)? ${{ (env.true1 == env.true5) && 'Yes' || 'No' }}"
          echo "true1 ($true1) == true6 ($true6)? ${{ (env.true1 == env.true6) && 'Yes' || 'No' }}"
          echo "true1 ($true1) == true7 ($true7)? ${{ (env.true1 == env.true7) && 'Yes' || 'No' }}"
          echo "true1 ($true1) == \"True\"? ${{ (env.true1 == 'True') && 'Yes' || 'No' }}"
          echo "ABC == abc? ${{ ('ABC' == 'abc') && 'Yes' || 'No' }}"
          if [[ "$true1" == "$true2" ]]; then
            echo "t1 = t2"
          fi
          if [[ "$true1" == "$true8" ]]; then
            echo "t1 = t7"
          fi
          echo Done
        shell: bash

      # A single line string, nothing special here
      - run: echo "Single line"

      # The bracket means the newline is replaced with a space
      - run: >                    
          echo This appears as
          a single line
      # The pipe means this is seen as a multi-line element
      - run: |
          echo "This is line one"
          echo "This is line two"

      - name: "Test numeric values and comparisons"
        run: |
          echo "Testing Numbers ($number1, $number2, $number3, $number4, $number5)"
          echo "$number1 < 2? ${{ (env.number1 < 2) && 'Yes' || 'No' }}"
          echo "$number1 > 2? ${{ (env.number1 > 2) && 'Yes' || 'No' }}"
          echo "$number2 < 3000? ${{ (env.number2 < 3000) && 'Yes' || 'No' }}"
          echo "$number2 > 3000? ${{ (env.number2 > 3000) && 'Yes' || 'No' }}"
          echo "$number3 < 3000? ${{ (env.number3 < 3000) && 'Yes' || 'No' }}"
          echo "$number3 > 3000? ${{ (env.number3 > 3000) && 'Yes' || 'No' }}"
          echo "$number4 < 3000? ${{ (env.number4 < 3000) && 'Yes' || 'No' }}"
          echo "$number4 > 3000? ${{ (env.number4 > 3000) && 'Yes' || 'No' }}"
          echo "$number5 < 3000? ${{ (env.number5 < 5000) && 'Yes' || 'No' }}"
          echo "$number5 > 3000? ${{ (env.number5 > 5000) && 'Yes' || 'No' }}"

      - name: Checkout python script
        uses: actions/checkout@v7

      - name: Python Script Output
        id: pso
        run: |
          echo "Here's the full output:"
          python ./output_test.py
          
          echo "Capturing the output:"
          OUTPUT=$(python ./output_test.py)
          echo "Output is $OUTPUT"
          echo "element1 = $(jq -r '.element1' <<< "$OUTPUT")"
          echo "element2 = $(jq -r '.element2' <<< "$OUTPUT")"
          echo "element3 = $(jq -r '.element3' <<< "$OUTPUT")"
          echo "element4 = $(jq -r '.element4' <<< "$OUTPUT")"
          echo "JSON_OUT=$OUTPUT" >> $GITHUB_OUTPUT

      - name: Python Script Input
        run: |
          echo "raw JSON = $RAW_JSON"
          echo "element1 = $EL1"
          echo "element2 = $EL2"
          echo "element3 = $EL3"
          echo "element4 = $EL4"
        env:
          RAW_JSON: ${{ steps.pso.outputs.JSON_OUT }}
          EL1: ${{ fromJSON(steps.pso.outputs.JSON_OUT).element1 }}
          EL2: ${{ fromJSON(steps.pso.outputs.JSON_OUT).element2 }}
          EL3: ${{ fromJSON(steps.pso.outputs.JSON_OUT).element3 }}
          EL4: ${{ fromJSON(steps.pso.outputs.JSON_OUT).element4 }}

on: push